# Local / development — loaded when APP_ENV is unset or APP_ENV=dev

http_port: "8080"
database_url: "postgres://postgres:postgres@localhost:5432/payment_dev?sslmode=disable"
payment_gateway: "stub"
payment_gateway_priority:
  - stub
  - stub_fallback
  - stub_down

# Background poller: re-calls gateway CheckPaymentStatus for rows whose response_status is still retryable.
payment_communication_retry:
  enabled: true
  interval_seconds: 10
  retryable_response_statuses:
    - pending
    - "429"
    - "503"
  max_poll_attempts: 30
  batch_limit: 50
